<!DOCTYPE html>
<html lang="en">
<head>
<!-- custom fonts here -->

        
<style>
html{
background-color: green;
font-family:/*insert font family here*/;
background-image:/*insert bg here*/ ;
background-size:/*fit bg here*/;

}

header{
border: 3px groove red;
background-image: url(https://bettysgraphics.neocities.org/images/backgrounds/024C.jpg);        
width: 900px;
height: 150px;
        
}

main/*this is where your boxes will learn how to behave, this is your parent box*/
{display:grid;
grid-template-rows:1fr 1fr 1fr;
width:900px;
border:3px solid black;
background-color:gray;
height: fit-content;
        
}   

.box1
{display: grid;
 grid-template-columns:1fr 1fr 1fr;
 background-color:gold;
 border:3px dashed brown;
 height: 300px;
}

  .intro {
border: 2px solid white;
background-image: url(https://bettysgraphics.neocities.org/images/backgrounds/021C.jpg);
background-size: 300px;
height: 200px;
overflow-y: scroll;

        
}

  .about {
        
}   

 .extras {
      
}        

 /*Start of top row*/       
.box2
{display: grid;
 grid-template-columns: 1fr 1fr 1fr;
background-color: deepskyblue;
 border: 3px dashed yellow;     
}

 /*End of top row*/       
 .box3
 {display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  background-color: blueviolet;
  border: 3px dashed pink;
                
        }
        
</style>
</head>
<body>

<header>My Plushies!</header>
        
<main>
<div class="box1">Albert
<div class="intro">Hi welcome to my website</div>
<div class="about">My favorite color is green</div>
<div class="extras">Blinkies and Stamps or whatever can go here</div>
        
</div>

<div class="box2">Suno</div>

<div class="box3">Cedeno</div>
   
</main>

<footer></footer>


</body>






        
</html>
